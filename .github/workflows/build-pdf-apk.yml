name: Build PDF-Support APK

on:
  push:
    branches:
      - claude/add-pdf-support-OA4gN
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fdroid debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy CI gradle.properties
        run: |
          mkdir -p ~/.gradle
          cp .github/runner-files/ci-gradle.properties ~/.gradle/gradle.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build APK
        run: ./gradlew :android:assembleFdroidDebug --no-daemon --stacktrace

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find android/build/outputs/apk -name '*.apk' | head -n1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK produced" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename "$APK_PATH")" >> "$GITHUB_OUTPUT"
          ls -lh "$APK_PATH"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ireader-pdf-support-apk
          path: ${{ steps.locate.outputs.apk_path }}

      - name: Publish APK to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-support-latest
          name: IReader (PDF support build)
          body: |
            Latest debug APK built from `claude/add-pdf-support-OA4gN`.

            Built from commit ${{ github.sha }}.

            ## Install on Android
            1. Download the `.apk` below.
            2. On your phone, open the file and tap **Install**.
               (You may need to allow "Install unknown apps" for your browser/file manager.)
          files: ${{ steps.locate.outputs.apk_path }}
          prerelease: true
          make_latest: "true"
